services:
  db:
    image: mongo:8.2.5
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://admin:admin@db:27017/cryptowatch?authSource=admin
      CMC_API_KEY: ${CMC_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_MODE: backend
        BACKEND_API_ORIGIN: http://backend:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mongo-data:
